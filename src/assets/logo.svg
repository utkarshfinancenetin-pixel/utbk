<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" fill="none">
  <!-- Utkarsh Emblem -->
  <g transform="translate(4, 5)">
    <!-- Sun / Glow Arc in Utkarsh Orange -->
    <circle cx="26" cy="22" r="15" fill="#FFF3E8"/>
    <path d="M26 7 C36 7 43 15 43 24 C43 27 42 30 40 33" stroke="#F37022" stroke-width="4.2" stroke-linecap="round"/>
    
    <!-- Rising Bird / Dynamic U wing left (Deep Blue) -->
    <path d="M10 17 C10 34 20 45 31 45 C39 45 45 40 48 34 C43 37 37 38 31 38 C23 38 16 29 16 19 C16 16 17 13 18 11 C14 12 10 14 10 17 Z" fill="#0A3871"/>
    
    <!-- Rising Sunbeam / Ascending Bird Wing right (Utkarsh Orange) -->
    <path d="M26 9 C30 9 36 11 41 16 C46 21 49 28 48 35 C45 28 40 22 34 18 C31 16 29 15 26 15 C23 15 21 16 19 17 C21 13 23 9 26 9 Z" fill="#F37022"/>
    <circle cx="34" cy="13" r="3.2" fill="#F37022"/>
    
    <!-- Central Swoosh -->
    <path d="M14 24 C18 39 33 43 45 34 C39 39 29 39 22 33 C18 29 15 26 14 24 Z" fill="#0A3871"/>
  </g>

  <!-- Typography -->
  <g transform="translate(62, 11)">
    <!-- UTKARSH FINANCE in one continuous text line using tspan -->
    <text x="0" y="25" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="0.8">
      <tspan fill="#0A3871">UTKARSH </tspan>
      <tspan fill="#F37022">FINANCE</tspan>
    </text>
    
    <!-- Tagline: आपकी उम्मीद का फाइनेंस -->
    <text x="1" y="42" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#F37022" letter-spacing="0.5">
      आपकी उम्मीद का फाइनेंस
    </text>
  </g>
</svg>
